{% extends 'base.html' %}{% block content %}<h2>Semesters</h2><form method="post" class="card p-3 mb-4"><div class="row g-2"><div class="col"><input class="form-control" name="name" placeholder="Semester 1" required></div><div class="col"><input class="form-control" name="academic_year" placeholder="2026-27" required></div><div class="col"><input class="form-control" type="date" name="start_date" required></div><div class="col"><input class="form-control" type="date" name="end_date" required></div><div class="col"><button class="btn btn-primary">Create semester</button></div></div></form><table class="table"><tr><th>Semester</th><th>Academic year</th><th>Start</th><th>End</th></tr>{% for s in semesters %}<tr><td>{{ s.name }}</td><td>{{ s.academic_year }}</td><td>{{ s.start_date }}</td><td>{{ s.end_date }}</td></tr>{% endfor %}</table>{% endblock %}
