{% extends 'base.html' %}{% block content %}<h2>Students</h2><form method="post" class="card p-3 mb-4"><div class="row g-2"><div class="col"><input class="form-control" name="roll_no" placeholder="Roll number" required></div><div class="col"><input class="form-control" name="full_name" placeholder="Full name" required></div><div class="col"><input class="form-control" name="email" placeholder="Email"></div><div class="col"><select class="form-select" name="class_id"><option value="">Class (optional)</option>{% for c in classes %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div><div class="col"><button class="btn btn-primary">Add student</button></div></div></form><table class="table table-striped"><tr><th>Roll</th><th>Name</th><th>Email</th><th>Class</th></tr>{% for s in students %}<tr><td>{{ s.roll_no }}</td><td>{{ s.full_name }}</td><td>{{ s.email or '-' }}</td><td>{{ s.class_group.name if s.class_group else '-' }}</td></tr>{% endfor %}</table>{% endblock %}
